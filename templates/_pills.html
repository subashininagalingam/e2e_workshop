{% if w.phase == "completed" %}<span class="pill pill-done"><i class="bi bi-check2-circle"></i>Completed</span>{% elif w.reg == "open" %}<span class="pill pill-open"><i class="bi bi-door-open"></i>Registration Open</span>{% elif w.reg == "full" %}<span class="pill pill-full"><i class="bi bi-people-fill"></i>Full</span>{% else %}<span class="pill pill-closed"><i class="bi bi-lock-fill"></i>Closed</span>{% endif %}
<span class="pill pill-mode"><i class="bi bi-{% if w.mode == 'online' %}camera-video{% elif w.mode == 'offline' %}geo-alt{% else %}diagram-2{% endif %}"></i>{{ w.get_mode_display }}</span>{% if w.has_fee and w.phase != "completed" %}<span class="pill pill-fee"><i class="bi bi-currency-rupee"></i>{{ w.fee|floatformat:"-2" }}</span>{% endif %}
